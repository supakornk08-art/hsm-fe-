<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EEHSM</title>
<meta name="theme-color" content="#0b4ea2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EEHSM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="eehsm-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="eehsm-icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1b2430; --muted:#6b7684; --line:#dfe3e8;
  --brand:#0b4ea2; --brand-2:#0d2a5c; --soft:#eaf1fb;
  --ok:#1e9e5a; --okbg:#e3f6ec; --warn:#b97f00; --warnbg:#fff4d6; --bad:#d23a3a; --badbg:#fde5e5;
  --run:#0b4ea2; --runbg:#e4eefb; --idle:#8a95a3; --idlebg:#eef1f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --card:#1a2129; --ink:#e7ecf2; --muted:#93a0ae; --line:#2b3540; --soft:#1c2a3b;
    --okbg:#173527; --warnbg:#3a2f12; --badbg:#3d1c1c; --runbg:#18304f; --run:#8dbaf5; --idlebg:#232b34; --idle:#93a0ae;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,#1b6fd1,#0b3a85);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 18px}
.hw{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px}
.logo{height:30px;background:#fff;border-radius:6px;padding:3px 6px;flex:none}
.app{display:flex;align-items:center;gap:12px;margin-top:14px}
.app img{width:52px;height:52px;border-radius:13px;box-shadow:0 3px 10px rgba(0,0,0,.25);flex:none}
.app h1{margin:0;font-size:24px;letter-spacing:.5px}
.app p{margin:2px 0 0;opacity:.85;font-size:13px}
.today{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.today span{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.today b{font-size:15px}
main{max-width:860px;margin:0 auto;padding:6px 16px 40px}
h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 4px 8px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid{grid-template-columns:1fr 1fr}}
a.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:inherit;text-decoration:none;min-height:76px}
a.it:active{transform:scale(.99);background:var(--soft)}
a.it img{width:54px;height:54px;border-radius:12px;flex:none}
.tx{min-width:0;flex:1}
.nm{font-weight:700;line-height:1.25;font-size:15px}
.no{color:#f28c00;margin-right:6px;font-variant-numeric:tabular-nums}
.ar{color:var(--muted);font-size:12px;margin-top:2px}
.st{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.c-idle{background:var(--idlebg);color:var(--idle)} .c-run{background:var(--runbg);color:var(--run)}
.c-ok{background:var(--okbg);color:var(--ok)} .c-d{background:var(--warnbg);color:var(--warn)} .c-x{background:var(--badbg);color:var(--bad)}
.go{color:var(--muted);font-size:22px;flex:none}
footer{max-width:860px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="hw">
  <div class="top"><img class="logo" id="logo" alt="NIPPON STEEL | GSteel"></div>
  <div class="app"><img src="eehsm-icon-192.png" alt=""><div><h1>EEHSM</h1><p>Inspection &amp; Check sheets · HSM&amp;FE</p></div></div>
  <div class="today" id="today"></div>
</div></header>

<main>
  <h2>เริ่มเดินเครื่อง</h2>
  <div class="grid" id="gStart"></div>
  <h2>Inspection Report 01–10</h2>
  <div class="grid" id="gInsp"></div>
  <h2>เครื่องมือ</h2>
  <div class="grid" id="gTool"></div>
</main>
<footer><span>สถานะคำนวณจากข้อมูลที่บันทึกในเครื่องนี้</span><span>By SupakornK · EHSM</span></footer>

const START=[{f:'startup',img:'icon-192.png',nm:'HSM Start-up Check',ar:'เช็กลิสต์ก่อนเดินเครื่อง Plant'}];
const INSP=[
 {no:'01',f:'flow-lube',ic:'flow',nm:'Flow Switch & Lubrication of Mill Motor',ar:'Main motor'},
 {no:'02',f:'mill-motor',ic:'mill',nm:'Mill Motor & TR Oil Lubrication',ar:'Main motor'},
 {no:'03',f:'motor-temp',ic:'motor',nm:'Motor & Transformer Temp.',ar:'Main motor'},
 {no:'04',f:'cooling-fan',ic:'fan',nm:'Motor Cooling Fan',ar:'Main motor'},
 {no:'05',f:'descale-lube',ic:'descale',nm:'Motor Descaling & Oil Lube',ar:'Main motor'},
 {no:'06',f:'hyd-pump',ic:'hyd',nm:'Motor Pump Hydraulic',ar:'HYD. Room'},
 {no:'07',f:'gauge-water-air',ic:'gauge',nm:'Water & Air of Profile, Thickness gauge',ar:'HSM'},
 {no:'08',f:'hpc-air',ic:'hpcair',nm:'Temp. HPC & Air condition',ar:'Electrical room'},
 {no:'09',f:'special-gauge',ic:'spgauge',nm:'Special Gauge',ar:'HSM'},
 {no:'10',f:'earth-leak',ic:'earth',nm:'Earth leak Common Converter',ar:'EHSM'}];
const TOOL=[{f:'fault-lookup',ic:'fault',nm:'TMdrive-10e3 Fault Lookup',ar:'ค้นความหมายรหัส Fault'}];

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dm(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]:s;}
function status(f){try{return JSON.parse(localStorage.getItem('eehsm.status.'+f)||'null');}catch(e){return null;}}

function chips(s,isToday){
  if(!s||!s.n) return '<span class="chip c-idle">ยังไม่มีบันทึก</span>';
  let h='';
  if(isToday){
    h+= s.n>=s.total ? `<span class="chip c-ok">✓ ครบ ${s.n}/${s.total}</span>` : `<span class="chip c-run">กำลังตรวจ ${s.n}/${s.total}</span>`;
    if(s.shift) h+=`<span class="chip c-idle">กะ ${esc(s.shift)}</span>`;
    if(s.D) h+=`<span class="chip c-d">△ ${s.D}</span>`;
    if(s.X) h+=`<span class="chip c-x">X ${s.X}</span>`;
  } else {
    h+=`<span class="chip c-idle">ล่าสุด ${esc(dm(s.date))} · ${s.n}/${s.total}</span>`;
  }
  return h;
}
function card(it,withStatus){
  const s=withStatus?status(it.f):null, t=today(), isT=!!(s&&s.date===t);
  return `<a class="it" href="${it.f}.html"><img src="${it.img||it.ic+'-icon-192.png'}" alt="" loading="lazy">
   <div class="tx"><div class="nm">${it.no?`<span class="no">${it.no}</span>`:''}${esc(it.nm)}</div>
   <div class="ar">${esc(it.ar)}</div>${withStatus?`<div class="st">${chips(s,isT)}</div>`:''}</div><span class="go">›</span></a>`;
}
function render(){
  gStart.innerHTML=START.map(i=>card(i,false)).join('');
  gInsp.innerHTML=INSP.map(i=>card(i,true)).join('');
  gTool.innerHTML=TOOL.map(i=>card(i,false)).join('');
  const t=today(); let done=0,run=0,D=0,X=0;
  INSP.forEach(i=>{const s=status(i.f); if(s&&s.date===t&&s.n){ if(s.n>=s.total)done++; else run++; D+=s.D||0; X+=s.X||0; }});
  const d=new Date(), th=d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  document.getElementById('today').innerHTML=`<span>${esc(th)}</span><span>ครบ <b>${done}</b>/10 ใบ</span>`+
    (run?`<span>กำลังตรวจ <b>${run}</b></span>`:'')+(D?`<span>△ <b>${D}</b></span>`:'')+(X?`<span>X <b>${X}</b></span>`:'');
}
render();
addEventListener('pageshow',render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
addEventListener('storage',render);
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});

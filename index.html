<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSM Startup Check</title>
<meta name="theme-color" content="#1d4a74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HSM Check">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* Layout: control-room checklist — steel-blue app bar, sticky tab rail + progress strip, one card per machine group */
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb; --ink:#17212c; --muted:#5b6876; --line:#d6dce4; --line-2:#e8ecf1;
  --steel:#1d4a74; --steel-ink:#ffffff; --steel-soft:#e4ecf5; --track:#d7dde5;
  --pass:#1b7a45; --pass-bg:#e2f3e9; --pass-line:#b5dcc4;
  --fail:#b3261e; --fail-bg:#fcebea; --fail-line:#efc0bc;
  --warn:#8a5a00; --warn-bg:#fff3d6;
  --shadow:0 1px 2px rgba(20,35,55,.08);
  --f-body:-apple-system,"Sukhumvit Set","Thonburi","Leelawadee UI","Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#18212b; --panel-2:#1d2833; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2c3a48; --line-2:#24303c;
  --steel:#173b5e; --steel-ink:#ffffff; --steel-soft:#1f3347; --track:#2e3b49;
  --pass:#3fb06f; --pass-bg:#16301f; --pass-line:#265a3a;
  --fail:#ef6a5f; --fail-bg:#3a1c1a; --fail-line:#6b2e2a;
  --warn:#e3b34a; --warn-bg:#3a2e12; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#18212b; --panel-2:#1d2833; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2c3a48; --line-2:#24303c;
  --steel:#173b5e; --steel-ink:#ffffff; --steel-soft:#1f3347; --track:#2e3b49;
  --pass:#3fb06f; --pass-bg:#16301f; --pass-line:#265a3a;
  --fail:#ef6a5f; --fail-bg:#3a1c1a; --fail-line:#6b2e2a;
  --warn:#e3b34a; --warn-bg:#3a2e12; --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}

/* app bar */
.appbar{background:var(--steel);color:var(--steel-ink)}
.appbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{flex:none;background:#fff;border-radius:6px;padding:3px 6px;line-height:0}
.logo img{height:38px;width:auto;display:block}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;text-wrap:balance}
.runchip{margin-top:3px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--steel-ink);border-radius:999px;padding:2px 10px;font-size:13px;max-width:100%}
.runchip b{font-weight:600}
.runchip .caret{opacity:.7}

/* sticky rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 6px;scrollbar-width:none;max-width:860px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:flex;gap:7px;align-items:center;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.tab .tb{font-weight:500;font-size:11.5px;border-radius:999px;padding:0 6px;background:var(--line-2);color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .tb{background:rgba(255,255,255,.18);color:var(--steel-ink)}
.tab .tb.ok{background:var(--pass);color:#fff}
.tab .tb.bad{background:var(--fail);color:#fff}
.prog{max-width:860px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.track{flex:1 1 140px;height:8px;background:var(--track);border-radius:6px;overflow:hidden;display:flex;gap:2px}
.track span{display:block;height:100%} .track .p{background:var(--pass)} .track .f{background:var(--fail)}
.counts{display:flex;gap:10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-p{color:var(--pass)} .c-f{color:var(--fail)} .c-l{color:var(--muted)}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* banner */
.banner{margin:12px 0 0;padding:9px 12px;border-radius:8px;font-size:13px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--line)}

/* list */
main{padding-block:12px 90px}
.sec{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin:18px 2px 8px;text-transform:none}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.grp>summary{list-style:none;padding:11px 14px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
.grp[open]>summary::before{transform:rotate(45deg)}
.grp .gtag{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill{border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:600}
.pill.done{background:var(--pass-bg);color:var(--pass)} .pill.fail{background:var(--fail-bg);color:var(--fail)}

.item{border-top:1px solid var(--line-2);padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.item .txt{min-width:0;display:flex;gap:8px;align-items:baseline}
.item .no{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:20px}
.item .lab{min-width:0;overflow-wrap:anywhere}
.sym{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--steel-soft);color:var(--steel);border-radius:4px;padding:0 6px;margin-right:6px;white-space:nowrap}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sym{color:#9cc3ea} }
:root[data-theme="dark"] .sym{color:#9cc3ea}
.by{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.item.is-fail{background:var(--fail-bg)}
.item.is-na{color:var(--muted);background:var(--panel-2)}
.na-tag{font-size:11.5px;border:1px dashed var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;min-width:62px;min-height:40px;padding:0 10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on-p{background:var(--pass);color:#fff}
.seg button.on-f{background:var(--fail);color:#fff}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.failbox{grid-column:1 / -1;display:grid;gap:8px;margin-top:2px}
.failbox textarea{width:100%;border:1px solid var(--fail-line);border-radius:8px;padding:8px 10px;min-height:44px;resize:vertical;background:var(--panel);font-size:16px}
.fixrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fix{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.fix button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.fix button+button{border-left:1px solid var(--line)}
.fix button.on-open{background:var(--fail);color:#fff}
.fix button.on-done{background:var(--pass);color:#fff}
.addphoto{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--fail-line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);cursor:pointer}
.addphoto input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.addphoto.busy{opacity:.6;pointer-events:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--fail) inset}100%{box-shadow:none}}
@media (prefers-reduced-motion: reduce){ .flash{animation:none;box-shadow:0 0 0 3px var(--fail) inset} }

/* summary */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
@media (min-width:640px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} }
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted)} .kpi .v{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums} .kpi .s{font-size:12px;color:var(--muted)}
.h2{font-size:16px;font-weight:700;margin:18px 2px 8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.h2 small{font-weight:400;color:var(--muted);font-size:13px}
.fcard{background:var(--panel);border:1px solid var(--fail-line);border-left:4px solid var(--fail);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:grid;gap:4px}
.fcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.fcard .what{font-weight:600}
.fcard .why{font-size:14px}
.st{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;margin-left:auto}
.st.open{background:var(--fail);color:#fff} .st.done{background:var(--pass-bg);color:var(--pass);border:1px solid var(--pass-line)}
.okbox{background:var(--panel);border:1px solid var(--pass-line);border-left:4px solid var(--pass);border-radius:8px;padding:10px 12px;color:var(--pass);font-weight:600}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 14px;border-top:1px solid var(--line-2);align-items:center}
.srow .sbar{grid-column:1 / -1}
.srow.head{background:var(--panel-2);border-top:0;cursor:pointer;padding-block:10px}
.srow .nm{font-size:14px;min-width:0;overflow-wrap:anywhere}
.srow.head .nm{font-weight:700;font-size:15px}
.sbar{display:flex;gap:2px;height:10px}
.srow.head .sbar{height:14px}
.sbar span{display:block;height:100%}
.sbar span:first-child{border-radius:4px 0 0 4px} .sbar span:last-child{border-radius:0 4px 4px 0} .sbar span:only-child{border-radius:4px}
.sbar .p{background:var(--pass)} .sbar .f{background:var(--fail)} .sbar .l{background:var(--track)}
.pct{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct b{font-size:14px} .pct .fl{color:var(--fail);font-weight:600} .pct .cnt{color:var(--muted);margin-left:5px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:10px 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--steel-ink)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,28,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);font-size:16px;width:100%}
.runlist{display:grid;gap:6px;margin-top:14px}
.runitem{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.runitem[aria-current="true"]{border-color:var(--steel);box-shadow:0 0 0 1px var(--steel) inset}
.runitem small{color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:6px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1} .toast.err{background:var(--fail);color:#fff}
html{-webkit-tap-highlight-color:transparent}
body{margin:0}
.appbar{padding-top:env(safe-area-inset-top,0px)}
.runchip small{opacity:.8}
.ver{font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center}
.btn.danger{color:var(--fail);border-color:var(--fail-line)}
.btn.danger.armed{background:var(--fail);color:#fff}
.tools .spacer{flex:1}
.form .full{grid-column:1/-1}
.imp{display:inline-flex;align-items:center}
.imp input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- print ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:10mm}
  html,body,#print,#print *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#000}
  .appbar,.rail,.wrap,.scrim,.lb,.toast{display:none!important}
  #print{display:block;font-size:10pt;color:#111;position:relative}
  #print .plogo{position:absolute;left:0;top:0}
  #print .plogo img{height:14mm}
  #print h1{font-size:13pt;margin:0 0 2px;text-align:center;padding:0 36mm}
  #print h2{font-size:10.5pt;margin:0 0 6px;text-align:center;font-weight:600}
  #print .pm{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:9.5pt;margin:6mm 0 4px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border:1px solid #555;padding:2px 5px;vertical-align:top;font-size:8.8pt}
  #print th{background:#e6ebf0}
  #print td.c{text-align:center;width:36px}
  #print td.g{font-weight:700;width:120px}
  #print tr.f td{background:#fde7e5}
  #print tr.na td{color:#777;background:#f2f2f2}
  #print tr.cap td{font-weight:700;background:#dde4ec}
  #print thead{display:table-header-group}
  #print tr{page-break-inside:avoid}
  #print .sum{margin:6px 0;font-size:9.5pt}
  #print .sign{margin-top:8px;page-break-inside:avoid}
  #print .sign th{font-size:8pt}
  #print .sign td{height:56px;text-align:center;vertical-align:bottom;font-size:8pt;width:14.28%}
  #print .foot{font-size:8pt;color:#555;margin-top:4px}
  #print .pk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4mm 0}
  #print .pk div{border:1px solid #bbb;border-radius:4px;padding:4px 6px;font-size:8.5pt}
  #print .pk b{display:block;font-size:15pt}
  #print .pbar{display:flex;gap:1px;height:9px;min-width:60mm}
  #print .pbar span{display:block;height:100%}
  #print .pbar .p{background:#1b7a45} #print .pbar .f{background:#b3261e} #print .pbar .l{background:#d7dde5}
  #print .ph{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
  #print .ph img{height:22mm;width:auto;border:1px solid #bbb}
  #print h3{font-size:10.5pt;margin:5mm 0 2mm}
}
</style>
</head>

/* ---------- photo store (IndexedDB) ---------- */
const PH = {
  db:null, urls:{},
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ const r=indexedDB.open("hsm-check-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); }); },
  async put(id, blob){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("p","readwrite"); t.objectStore("p").put(blob,id); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); },
  async get(id){ const db=await this.open(); return new Promise(res=>{ const q=db.transaction("p").objectStore("p").get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); },
  async del(id){ const db=await this.open(); return new Promise(res=>{ const t=db.transaction("p","readwrite"); t.objectStore("p").delete(id); t.oncomplete=()=>res(); t.onerror=()=>res(); }); },
  async url(id){ if(this.urls[id]) return this.urls[id]; const b=await this.get(id); if(!b) return ""; return this.urls[id]=URL.createObjectURL(b); }
};
async function hydrateImgs(root){
  const imgs=(root||document).querySelectorAll("img[data-ph]");
  for(const img of imgs){ const u=await PH.url(img.dataset.ph); if(u) img.src=u; else img.alt="(ไม่มีรูปในเครื่องนี้)"; }
}

let tt; function toast(msg, err){ const t=$("#toast"); t.textContent=msg; t.classList.toggle("err",!!err); t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"), err?5000:2600); }

/* ---------- counting ---------- */
function tally(items){
  let p=0,f=0,open=0; items.forEach(i=>{ const r=S.results[i.key]; if(!r) return; if(r.s==="P")p++; else if(r.s==="F"){ f++; if(r.fix!=="done") open++; } });
  return { total:items.length, pass:p, fail:f, open, left:items.length-p-f };
}
const act = items => items.filter(i=>!i.na);
const pc = (n,d) => d ? Math.round(n/d*1000)/10 : 0;

/* ---------- tabs ---------- */
$("#tabs").innerHTML = FORMS.map(f=>`<button class="tab" role="tab" type="button" data-view="${f.config.formId}">${esc(f.tab)} <span class="tb"></span></button>`).join("")
  + `<button class="tab" role="tab" type="button" data-view="${SUMMARY}">สรุป</button>`;
function updateTabs(){
  document.querySelectorAll(".tab").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.view===S.view);
    const tb=b.querySelector(".tb"); if(!tb) return;
    const c=tally(act(formOf(b.dataset.view).items));
    tb.textContent = c.fail ? `FAIL ${c.fail}` : `${c.pass+c.fail}/${c.total}`;
    tb.className = "tb" + (c.fail?" bad":(c.pass===c.total?" ok":""));
  });
}
$("#tabs").addEventListener("click", e=>{ const b=e.target.closest(".tab"); if(!b||b.dataset.view===S.view) return; setView(b.dataset.view); window.scrollTo(0,0); });
function setView(v){
  if(v!==SUMMARY && !formOf(v)) v=FORMS[0].config.formId;
  S.view=v; ls.set("hsm.view", v);
  $("#prog").hidden = v===SUMMARY;
  S.filter="all"; document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.filter==="all"));
  render(); const t=document.querySelector(`.tab[data-view="${v}"]`); if(t) t.scrollIntoView({inline:"nearest",block:"nearest"});
}

/* ---------- checklist view ---------- */
function render(){
  updateTabs();
  if(S.view===SUMMARY){ renderSummary(); return; }
  const f=formOf(S.view); let html="", n=0;
  f.checklist.forEach(sec=>{
    if(f.checklist.length>1) html+=`<div class="sec">${esc(sec.name)} · ${esc(sec.en)}</div>`;
    sec.systems.forEach((sys,si)=>{
      const its=f.items.filter(i=>i.sec===sec.id && i.si===si);
      html+=`<details class="grp" open><summary>${esc(sys.name)}<span class="gtag"></span></summary>`;
      its.forEach(it=>{
        n++;
        const lab=`${it.tag?`<span class="sym">${esc(it.tag)}</span>`:""}${esc(it.txt)}`;
        if(it.na){ html+=`<div class="item is-na" data-key="${esc(it.key)}"><div class="txt"><span class="no">${n}</span><span class="lab">${lab}</span></div><span class="na-tag">ไม่ใช้งาน · ${esc(it.na)}</span></div>`; return; }
        html+=`<div class="item" data-key="${esc(it.key)}">
          <div class="txt"><span class="no">${n}</span><span class="lab">${lab}<span class="by"></span></span></div>
          <span class="seg" role="group" aria-label="ผลการตรวจ"><button type="button" data-v="P">PASS</button><button type="button" data-v="F">FAIL</button></span>
          <div class="failbox" hidden>
            <textarea id="rm-${esc(it.key)}" placeholder="อาการที่พบ เช่น Drive trip, Sensor สกปรก" aria-label="Remark"></textarea>
            <div class="fixrow">
              <span class="fix" role="group" aria-label="สถานะการแก้ไข"><button type="button" data-fix="open">ยังไม่แก้ไข</button><button type="button" data-fix="done">แก้ไขแล้ว</button></span>
              <label class="addphoto"><input type="file" accept="image/*" data-photo>📷 แนบรูป</label>
            </div>
            <div class="thumbs"></div>
          </div>
        </div>`;
      });
      html+=`</details>`;
    });
  });
  $("#view").innerHTML=html;
  f.items.forEach(it=>{ if(!it.na) updateItem(it.key); });
  updateGroups(); updateProgress(); applyFilter();
}
function fmtTime(iso){ if(!iso) return ""; return new Date(iso).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}); }
function updateItem(key){
  const row=document.querySelector(`.item[data-key="${CSS.escape(key)}"]`); if(!row) return;
  const r=S.results[key]||{};
  row.classList.toggle("is-fail", r.s==="F");
  const [bp,bf]=row.querySelectorAll(".seg button");
  bp.className=r.s==="P"?"on-p":""; bf.className=r.s==="F"?"on-f":"";
  bp.setAttribute("aria-pressed", r.s==="P"); bf.setAttribute("aria-pressed", r.s==="F");
  const fb=row.querySelector(".failbox"); fb.hidden = r.s!=="F";
  const ta=fb.querySelector("textarea"); if(document.activeElement!==ta && ta.value!==(r.remark||"")) ta.value=r.remark||"";
  fb.querySelectorAll(".fix button").forEach(b=>{ b.className = r.fix===b.dataset.fix ? "on-"+b.dataset.fix : ""; b.setAttribute("aria-pressed", r.fix===b.dataset.fix); });
  const th=fb.querySelector(".thumbs");
  th.innerHTML = (r.photos||[]).map(id=>`<span class="thumb"><img data-ph="${esc(id)}" alt="รูปประกอบ"><button type="button" class="x" data-rmphoto="${esc(id)}" aria-label="เอารูปออก">×</button></span>`).join("");
  hydrateImgs(th);
  row.querySelector(".by").textContent = r.by ? `ตรวจโดย ${r.by} · ${fmtTime(r.at)}` : "";
}
function updateGroups(){
  document.querySelectorAll(".grp").forEach(g=>{
    const keys=[...g.querySelectorAll(".item:not(.is-na)")].map(e=>e.dataset.key);
    let done=0,fail=0; keys.forEach(k=>{ const s=(S.results[k]||{}).s; if(s)done++; if(s==="F")fail++; });
    g.querySelector(".gtag").innerHTML=(fail?`<span class="pill fail">FAIL ${fail}</span>`:"")+(done===keys.length&&keys.length?`<span class="pill done">ครบ</span>`:`${done}/${keys.length}`);
  });
}
function updateProgress(){
  if(S.view===SUMMARY) return;
  const c=tally(act(formOf(S.view).items)), t=c.total||1;
  $("#np").textContent=c.pass; $("#nf").textContent=c.fail; $("#nl").textContent=c.left;
  $("#tp").style.width=(c.pass/t*100)+"%"; $("#tf").style.width=(c.fail/t*100)+"%";
}
function applyFilter(){
  document.querySelectorAll(".item").forEach(e=>{
    if(e.classList.contains("is-na")){ e.hidden = S.filter!=="all"; return; }
    const s=(S.results[e.dataset.key]||{}).s;
    e.hidden = !(S.filter==="all" || (S.filter==="left"&&!s) || (S.filter==="fail"&&s==="F"));
  });
  document.querySelectorAll(".grp").forEach(g=>{ g.hidden = ![...g.querySelectorAll(".item")].some(e=>!e.hidden); });
}
$("#chips").addEventListener("click", e=>{ const c=e.target.closest(".chip"); if(!c) return; S.filter=c.dataset.filter; document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x===c)); applyFilter(); });

function needRun(){ if(S.runId) return false; openRunSheet(); toast("เริ่มรอบตรวจก่อน แล้วค่อยกดเช็ค", true); return true; }
function setResult(key, body){
  if(body) S.results[key]=body; else delete S.results[key];
  saveResults(); updateItem(key); updateGroups(); updateProgress(); updateTabs();
}
function bodyFor(key, patch){
  const it=ITEM[key], prev=S.results[key]||{}, run=curRun()||{};
  return { form:it.form, item:it.id, s:prev.s, remark:prev.remark||"", fix:prev.fix||"", photos:prev.photos||[], ...patch, by:run.inspector||"", at:new Date().toISOString() };
}
const remarkTimers={};
$("#view").addEventListener("click", e=>{
  const go=e.target.closest("[data-go]"); if(go){ jumpTo(go.dataset.go); return; }
  const full=e.target.closest("img[data-ph]"); if(full && !e.target.closest(".x")){ PH.url(full.dataset.ph).then(u=>{ if(u){ $("#lbimg").src=u; $("#lb").hidden=false; } }); return; }
  const act2=e.target.closest("[data-act]"); if(act2){ actions[act2.dataset.act](act2); return; }
  const row=e.target.closest(".item"); if(!row||row.classList.contains("is-na")) return;
  const key=row.dataset.key;
  const v=e.target.closest(".seg button");
  if(v){ if(needRun()) return;
    const cur=(S.results[key]||{}).s;
    if(cur===v.dataset.v){ setResult(key,null); return; }
    setResult(key, v.dataset.v==="P" ? bodyFor(key,{s:"P",remark:"",fix:"",photos:[]}) : bodyFor(key,{s:"F"}));
    if(v.dataset.v==="F") setTimeout(()=>row.querySelector("textarea").focus(),50);
    return; }
  const fx=e.target.closest(".fix button"); if(fx){ setResult(key, bodyFor(key,{fix:fx.dataset.fix})); return; }
  const rm=e.target.closest("[data-rmphoto]");
  if(rm){ const r=S.results[key]; setResult(key, bodyFor(key,{photos:(r.photos||[]).filter(x=>x!==rm.dataset.rmphoto)})); PH.del(rm.dataset.rmphoto); }
});
$("#view").addEventListener("input", e=>{
  if(e.target.tagName!=="TEXTAREA") return;
  const key=e.target.closest(".item").dataset.key, val=e.target.value;
  clearTimeout(remarkTimers[key]);
  remarkTimers[key]=setTimeout(()=>{ if(S.results[key]){ S.results[key]=bodyFor(key,{remark:val}); saveResults(); } }, 400);
});
$("#view").addEventListener("change", async e=>{
  if(!e.target.matches("[data-photo]")) return;
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  const row=e.target.closest(".item"), key=row.dataset.key, lab=e.target.closest(".addphoto");
  lab.classList.add("busy");
  try{
    const blob=await shrink(file);
    const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    await PH.put(id, blob);
    const r=S.results[key]||{};
    setResult(key, bodyFor(key,{photos:[...(r.photos||[]), id]}));
    toast("แนบรูปแล้ว");
  }catch(err){ toast("แนบรูปไม่สำเร็จ", true); }
  finally{ lab.classList.remove("busy"); }
});
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const m=1280, k=Math.min(1, m/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.72); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src=url;
  });
}
$("#lb").addEventListener("click", ()=>{ $("#lb").hidden=true; });

  const seg=(k,n)=>n?`<span class="${k}" style="flex:${n}"></span>`:"";
  return `<div class="${cls||"sbar"}" role="img" aria-label="PASS ${c.pass} FAIL ${c.fail} ยังไม่เช็ค ${c.left} จาก ${c.total}">${seg("p",c.pass)}${seg("f",c.fail)}${seg("l",c.left)}</div>`;
}
const pctHTML=c=>`<b>${pc(c.pass,c.total)}%</b>${c.fail?` <span class="fl">FAIL ${pc(c.fail,c.total)}%</span>`:""}<span class="cnt">${c.pass+c.fail}/${c.total}</span>`;
const stHTML=r=>r.fix==="done"?`<span class="st done">✔ แก้ไขแล้ว</span>`:r.fix==="open"?`<span class="st open">⚠ ยังไม่แก้ไข</span>`:`<span class="st open">? ยังไม่ระบุสถานะ</span>`;
const failList=()=>act(ALL_ITEMS).filter(i=>(S.results[i.key]||{}).s==="F").sort((a,b)=>((S.results[a.key].fix==="done")-(S.results[b.key].fix==="done")));
function inspectors(){ return [...new Set(Object.values(S.results).map(r=>r.by).filter(Boolean))]; }

    <div class="kpis">
      <div class="kpi"><div class="k">เช็คแล้ว</div><div class="v">${pc(done,all.total)}%</div><div class="s">${done} / ${all.total} ข้อ</div></div>
      <div class="kpi"><div class="k">PASS</div><div class="v c-p">✔ ${pc(all.pass,all.total)}%</div><div class="s">${all.pass} ข้อ</div></div>
      <div class="kpi"><div class="k">FAIL</div><div class="v c-f">✖ ${pc(all.fail,all.total)}%</div><div class="s">${all.fail} ข้อ · ยังไม่แก้ไข ${all.open}</div></div>
      <div class="kpi"><div class="k">ยังไม่เช็ค</div><div class="v c-l">${pc(all.left,all.total)}%</div><div class="s">${all.left} ข้อ</div></div>
    </div>
    <div class="tools">
      <button class="btn primary" type="button" data-act="share">แชร์ผลรอบนี้</button>
      <button class="btn" type="button" data-act="printSummary">พิมพ์ / PDF</button>
      <label class="btn imp"><input type="file" accept=".json,application/json" id="impFile" multiple>นำเข้าผลจากเครื่องอื่น</label>
    </div>
    <div class="h2">รายการที่ FAIL <small>${fails.length} ข้อ · ยังไม่แก้ไข ${all.open}</small></div>`;
  h += fails.length ? fails.map(i=>{ const r=S.results[i.key];
      return `<div class="fcard" data-go="${esc(i.key)}" role="button" tabindex="0">

        <div class="what">✖ ${i.tag?`<span class="sym">${esc(i.tag)}</span>`:""}${esc(i.txt)}</div>
        <div class="why">${esc(r.remark||"(ยังไม่ระบุอาการ)")}</div>
        ${(r.photos||[]).length?`<div class="thumbs">${r.photos.map(id=>`<span class="thumb"><img data-ph="${esc(id)}" alt="รูปประกอบ"></span>`).join("")}</div>`:""}
        ${r.by?`<div class="by">ตรวจโดย ${esc(r.by)} · ${fmtTime(r.at)}</div>`:""}
      </div>`; }).join("")
    : `<div class="okbox">✔ ไม่มีรายการ FAIL</div>`;
  h += `<div class="legend"><span><i style="background:var(--pass)"></i>PASS</span><span><i style="background:var(--fail)"></i>FAIL</span><span><i style="background:var(--track)"></i>ยังไม่เช็ค</span><span>% = สัดส่วน PASS ต่อจำนวนข้อของหัวข้อ</span></div>`;
  FORMS.forEach(f=>{

    f.checklist.forEach(sec=>sec.systems.forEach((sys,si)=>{
      const its=items.filter(i=>i.sec===sec.id&&i.si===si); if(!its.length) return;
      const g=tally(its);

}
$("#view").addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches(".fcard")){ e.preventDefault(); jumpTo(e.target.dataset.go); } });

function jumpTo(target){
  if(ITEM[target]){
    setView(ITEM[target].form);
    const row=document.querySelector(`.item[data-key="${CSS.escape(target)}"]`);
    if(row){ row.closest("details").open=true; row.scrollIntoView({block:"center"}); row.classList.add("flash"); setTimeout(()=>row.classList.remove("flash"),1700); }
  } else { setView(target); window.scrollTo(0,0); }
}

/* ---------- share / export / import ---------- */
function blobToDataURL(b){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); }); }
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }
function csvText(){
  const run=curRun()||{};
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Date","Shift","Tab","Group","Symbol","Check Item","Result","Remark","Fix Status","Inspector","Checked At","Photos"]];
  ALL_ITEMS.forEach(i=>{ const r=S.results[i.key]||{};
    rows.push([run.date,run.shift,formOf(i.form).tab,i.sys,i.tag,i.txt, i.na?"N/A":r.s==="P"?"PASS":r.s==="F"?"FAIL":"", i.na?i.na:(r.remark||""),
      r.fix==="done"?"แก้ไขแล้ว":r.fix==="open"?"ยังไม่แก้ไข":"", r.by||"", r.at||"", (r.photos||[]).length]); });
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}
async function packJSON(){
  const run=curRun(); const photos={};
  for(const r of Object.values(S.results)) for(const id of (r.photos||[])){ const b=await PH.get(id); if(b) photos[id]=await blobToDataURL(b); }
  return JSON.stringify({ app:"HSM-STARTUP-CHECK", version:1, run, results:S.results, photos, exportedAt:new Date().toISOString() });
}
function fileBase(){ const r=curRun(); return `HSM_${(r.date||"").replace(/-/g,"")}_${r.shift}_${(r.inspector||"").trim().replace(/[\\/:*?"<>|\s]+/g,"_")}_${stamp()}`; }
function saveFile(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const actions = {
  async share(){
    if(!curRun()){ openRunSheet(); return; }
    const base=fileBase();
    const files=[ new File([await packJSON()], base+".json", {type:"application/json"}), new File([csvText()], base+".csv", {type:"text/csv"}) ];
    const all=tally(act(ALL_ITEMS)), run=curRun();
    const text=`HSM Start up ${thDate(run.date)} กะ ${run.shift}\nเช็คแล้ว ${all.pass+all.fail}/${all.total} · PASS ${all.pass} · FAIL ${all.fail} (ยังไม่แก้ไข ${all.open})`
      + failList().map(i=>{ const r=S.results[i.key]; return `\n✖ ${i.sys} ${i.tag||""} ${i.txt}: ${r.remark||"-"} [${r.fix==="done"?"แก้ไขแล้ว":"ยังไม่แก้ไข"}]`; }).join("");
    try{
      if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files, title:base, text}); }
      else if(navigator.share){ await navigator.share({title:base, text}); files.forEach(f=>saveFile(f.name,f)); }
      else { files.forEach(f=>saveFile(f.name,f)); toast("บันทึกไฟล์ผลแล้ว"); }
    }catch(e){ if(e && e.name!=="AbortError") toast("แชร์ไม่สำเร็จ", true); }
  },
  async printSummary(){ await buildPrintSummary(); window.print(); },
  async printForm(){ await buildPrintForms(); window.print(); },
  delRun(btn){
    if(!btn.classList.contains("armed")){ btn.classList.add("armed"); btn.textContent="แตะอีกครั้งเพื่อยืนยันการลบ"; setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed"); btn.textContent="ลบรอบนี้ออกจากเครื่อง"; } }, 4000); return; }
    const run=curRun(); Object.values(S.results).forEach(r=>(r.photos||[]).forEach(id=>PH.del(id)));
    try{ localStorage.removeItem("hsm.res."+run.id); }catch(e){}
    S.runs=S.runs.filter(r=>r.id!==run.id); saveRuns(); S.runId=null; ls.set("hsm.run", null); S.results={};
    runLabel(); render(); toast("ลบรอบตรวจแล้ว");
  }
};
async function importFiles(files){
  let n=0, added=0;
  for(const f of files){
    try{
      const d=JSON.parse(await f.text());
      if(d.app!=="HSM-STARTUP-CHECK"||!d.run||!d.results) throw new Error("bad");
      for(const [id,u] of Object.entries(d.photos||{})){ if(!(await PH.get(id))) await PH.put(id, await dataURLToBlob(u)); }
      let run=S.runs.find(r=>r.id===d.run.id);
      if(!run){ run={...d.run}; S.runs.unshift(run); saveRuns(); }
      const mine=ls.get("hsm.res."+run.id)||{};
      for(const [k,r] of Object.entries(d.results)){ if(!ITEM[k]) continue; const cur=mine[k]; if(!cur || (r.at||"")>(cur.at||"")){ mine[k]=r; added++; } }
      ls.set("hsm.res."+run.id, mine);
      selectRun(run.id, true); n++;
    }catch(e){ toast(`เปิดไฟล์ ${f.name} ไม่ได้ ต้องเป็นไฟล์ .json ที่แชร์จากแอปนี้`, true); }
  }
  if(n){ render(); toast(`นำเข้า ${n} ไฟล์ อัปเดต ${added} รายการ`); }
}

const logoHTML=()=>`<div class="plogo"><img src="${$(".logo img").src}" alt=""></div>`;
function metaHTML(){ const r=curRun()||{}; return `<div class="pm"><span><b>วันที่:</b> ${thDate(r.date)}</span><span><b>กะ:</b> ${esc(r.shift||"-")}</span><span><b>ผู้ตรวจ:</b> ${esc(inspectors().join(", ")||r.inspector||"-")}</span></div>`; }
function signHTML(){ return `<table class="sign"><tr>${SIGNERS.map(n=>`<th>${n}</th>`).join("")}</tr><tr>${SIGNERS.map(()=>`<td>(......../......../........)</td>`).join("")}</tr></table>`; }
async function buildPrintForms(){
  let h="";
  FORMS.forEach((f,fi)=>{
    const hasTag=f.items.some(i=>i.tag);
    let rows="", last=null;

      if(f.checklist.length>1) rows+=`<tr class="cap"><td colspan="5">${esc(sec.name)} — ${esc(sec.en)}</td></tr>`;
      f.items.filter(i=>i.sec===sec.id).forEach(i=>{

        const c1=hasTag?esc(i.tag):(i.sys!==last?esc(i.sys):"");

        const box=v=>na?"–":(r.s===v?"☑":"☐");
        rows+=`<tr class="${fl?"f":na?"na":""}"><td class="g">${c1}</td><td>${esc(i.txt)}</td><td class="c">${box("P")}</td><td class="c">${box("F")}</td><td>${esc(rem)}</td></tr>`;
        last=i.sys;

      <div class="sum"><b>สรุป:</b> ${c.total} ข้อ · PASS ${c.pass} · FAIL ${c.fail} (ยังไม่แก้ไข ${c.open}) · ยังไม่เช็ค ${c.left}</div>${signHTML()}
      <div class="foot">** ถ้าตรวจพบความผิดปกติใดๆ ให้เขียนระบุอาการลงในช่อง Remark และระบุด้วยว่าได้รับการแก้ไขแล้วหรือยังไม่แก้ไข **</div></section>`;
  });
  $("#print").innerHTML=h;
}

  h+=`<h3>ความคืบหน้าแต่ละหัวข้อ</h3><table><thead><tr><th>หัวข้อ</th><th>Progress</th><th>PASS %</th><th>FAIL %</th><th>เช็คแล้ว</th></tr></thead><tbody>`;

/* ---------- runs ---------- */
function runLabel(){
  const r=curRun();
  $("#runlabel").innerHTML = r ? `รอบ <b>${thDate(r.date)}</b> · กะ <b>${esc(r.shift)}</b> · <small>${esc(r.inspector)}</small>` : "แตะเพื่อเริ่มรอบตรวจ";
}
function openRunSheet(){
  const r=curRun();
  $("#rf-date").value=today(); $("#rf-shift").value=r?r.shift:""; $("#rf-name").value=ls.get("hsm.name")||"";
  $("#runlist").innerHTML = S.runs.length ? `<div class="sub" style="margin:0">รอบตรวจในเครื่องนี้</div>` + S.runs.map(x=>`<button type="button" class="runitem" data-run="${esc(x.id)}" aria-current="${x.id===S.runId}">
      <span><b>${thDate(x.date)}</b> · กะ ${esc(x.shift)}</span><small>${x.id===S.runId?"กำลังใช้":"เลือก"}</small></button>`).join("") : "";
  $("#runScrim").hidden=false;
}
function closeRunSheet(){ $("#runScrim").hidden=true; }
$("#runchip").addEventListener("click", openRunSheet);
$("#runClose").addEventListener("click", closeRunSheet);
$("#runScrim").addEventListener("click", e=>{ if(e.target.id==="runScrim") closeRunSheet(); const b=e.target.closest("[data-run]"); if(b){ selectRun(b.dataset.run); closeRunSheet(); } });
$("#runForm").addEventListener("submit", e=>{
  e.preventDefault();
  const date=$("#rf-date").value, shift=$("#rf-shift").value, name=$("#rf-name").value.trim();
  if(!date||!shift||!name){ toast("กรอกวันที่ กะ และชื่อผู้ตรวจให้ครบ", true); return; }
  ls.set("hsm.name", name);
  const id=`${date}_${shift}`;
  let run=S.runs.find(r=>r.id===id);
  if(run){ run.inspector=name; } else { run={id, date, shift, inspector:name, createdAt:new Date().toISOString()}; S.runs.unshift(run); }
  S.runs.sort((a,b)=>b.id.localeCompare(a.id)); saveRuns();
  selectRun(id); closeRunSheet(); toast(`เปิดรอบ ${thDate(date)} กะ ${shift} แล้ว`);
});
function selectRun(id, quiet){ S.runId=id; ls.set("hsm.run", id); loadResults(); runLabel(); if(!quiet) render(); }

/* ---------- boot ---------- */
if(S.runId && !curRun()) S.runId=null;
loadResults(); runLabel(); setView(S.view);
if(!S.runId) setTimeout(openRunSheet, 300);
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
